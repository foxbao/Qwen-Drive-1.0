# Compare a full-data planner with and without the NAVSIM-only VLM adapter.

[review]
output = "outputs/navsim-full-expert-adapter-review"
top_k = 12
tie_tolerance = 0.000001

[[review.experiments]]
name = "full-expert-adapter-vs-base"
baseline_name = "full-expert-base-vlm"
updated_name = "full-expert-navsim-adapter"
baseline = "outputs/navsim-val-direct/predictions.jsonl"
updated = "outputs/navsim-val-full-expert-navsim-adapter/predictions.jsonl"

[[review.experiments]]
name = "full-expert-adapter-vs-stage1"
baseline_name = "stage1-adapter-planner-sft"
updated_name = "full-expert-navsim-adapter"
baseline = "outputs/navsim-val-vlm-lora-navsim-only/predictions.jsonl"
updated = "outputs/navsim-val-full-expert-navsim-adapter/predictions.jsonl"
